# This nginx sits behind a TLS-terminating reverse proxy, so $scheme here is
# always "http". Trust the upstream proxy's X-Forwarded-Proto when present.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router / client-side routes still resolve on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed static assets aggressively
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # proxy API calls to the backend container over Docker's internal network
    location /api/ {
        proxy_pass http://vbcd-backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # proxy uploaded tileset/voxel file serving too
    location /files/ {
        proxy_pass http://vbcd-backend:8081/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}