spring:
  datasource:
    url: jdbc:h2:mem:backend;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

voxelizer:
  jar-path: ./build/test-fixtures/voxelizer.jar
  storage-root: ./build/test-storage/data
  mock-execution: true
  temp-path: ./build/test-storage/temp
  visualization-tiles-path: ./build/test-storage/3dtiles
  voxel-set-output-path: ./build/test-storage/voxelsets
  default-create:
    max-level: 15
    visualize: true
    visualize-color: grey
    cube-data-type: BYTE
    recursive: true
  default-diff:
    max-level: 15
    diff-operation: ADD_AND_REMOVE
    visualize: true
    diff-neighbor-mode: 6
    min-diff-filter-level: 12
    min-diff-neighbors: 2
    diff-neighbor-iterations: 4
    min-diff-cluster-size: 10
    union: true
    mass-summary: true
    cube-data-type: BYTE
    recursive: true
