services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: backend-postgis
    environment:
      POSTGRES_DB: voxel_change_detection
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: voxel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel -d voxel_change_detection"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgis-data:/var/lib/postgresql/data

volumes:
  postgis-data:
