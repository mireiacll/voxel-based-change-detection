spring:
  application:
    name: backend-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:voxel_change_detection}
    username: ${DB_USER:voxel}
    password: ${DB_PASSWORD:voxel}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: ${SERVER_PORT:8080}
  # honor X-Forwarded-Proto/Host from the TLS-terminating reverse proxy so
  # generated URLs (redirects, Location headers) use the external https scheme
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: voxelizer

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

voxelizer:
  jar-path: ${VOXELIZER_JAR_PATH:/app/mago-voxelizer.jar}
  storage-root: ${VOXELIZER_STORAGE_ROOT:/data}
  mock-execution: ${VOXELIZER_MOCK_EXECUTION:true}
  temp-path: ${VOXELIZER_TEMP_PATH:./storage/temp}
  visualization-tiles-path: ${VOXELIZER_VISUALIZATION_TILES_PATH:./storage/3dtiles}
  voxel-set-output-path: ${VOXELIZER_VOXEL_SET_OUTPUT_PATH:./storage/voxelsets}
  default-create:
    max-level: 15
    visualize: true
    visualize-color: gray
    cube-data-type: BYTE
    region-gpkg-path: ${VOXELIZER_DEFAULT_CREATE_REGION_GPKG_PATH:/data/Asan-LandCoverIndex-Vegetation.gpkg}
    recursive: true
  default-diff:
    max-level: 15
    diff-operation: ADD_AND_REMOVE
    visualize: true
    diff-neighbor-mode: 6
    min-diff-filter-level: 12
    min-diff-neighbors: 3
    diff-neighbor-iterations: 2
    min-diff-cluster-size: 20
    mass-summary: true
    cube-data-type: BYTE
    recursive: true
